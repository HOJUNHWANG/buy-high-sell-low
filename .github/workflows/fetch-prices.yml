name: Fetch Prices (S&P 100 + ETFs + Crypto)

on:
  # Cronjob.org dispatches every 10 minutes; the script filters stock/ETF
  # market hours while continuing to refresh crypto around the clock.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Fetch current prices
        run: python scripts/fetch_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
