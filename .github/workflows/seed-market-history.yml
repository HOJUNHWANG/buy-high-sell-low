name: Seed Market History

on:
  # Automatically backfill the tracked set after a market-universe change is
  # merged to main. Cronjob.org does not need to call this workflow.
  push:
    branches: [main]
    paths:
      - "scripts/tickers.py"
      - "scripts/seed_history.py"
      - ".github/workflows/seed-market-history.yml"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers to backfill"
        required: true
        default: "DELL PANW ANET SNDK"

permissions:
  contents: read

concurrency:
  group: seed-market-history
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Register reviewed index members and pending additions
        run: python scripts/sync_sp100.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Seed missing market history
        run: python scripts/seed_history.py $TICKERS
        env:
          # workflow_dispatch can override this; push runs use the maintained
          # default list below instead of accidentally seeding the full universe.
          TICKERS: ${{ inputs.tickers || 'DELL PANW ANET SNDK' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
