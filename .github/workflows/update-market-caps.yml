name: Update Market Caps (Daily)

on:
  # Cronjob.org owns production timing to avoid GitHub scheduled-run delays.
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional tickers to retry (comma or space separated)"
        type: string
        required: false
      dry_run:
        description: "Validate without writing market caps or fetch logs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-market-caps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Refresh market caps and ETF AUM
        run: |
          args=()
          if [[ -n "$TICKERS" ]]; then args+=("--ticker=$TICKERS"); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -u scripts/update_market_caps.py "${args[@]}"
        env:
          TICKERS: ${{ inputs.tickers }}
          DRY_RUN: ${{ inputs.dry_run }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
