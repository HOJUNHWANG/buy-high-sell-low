name: Fetch News & AI Summaries

on:
  # Cronjob.org owns production timing to avoid GitHub scheduled-run delays.
  workflow_dispatch:
    inputs:
      retry_only:
        description: Recover queued recent articles without inserting new articles
        type: boolean
        default: false
      retry_limit:
        description: Maximum queued articles to retry (0-120)
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Fetch news and generate summaries
        run: |
          args=(--retry-limit "$RETRY_LIMIT")
          if [ "$RETRY_ONLY" = "true" ]; then args+=(--retry-only); fi
          python scripts/fetch_news.py "${args[@]}"
        env:
          RETRY_ONLY: ${{ inputs.retry_only || 'false' }}
          RETRY_LIMIT: ${{ inputs.retry_limit || '20' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
